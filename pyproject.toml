[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "konichiwa"
version = "0.1.0"
description = "A delightful Japanese time-aware greeting and cultural phrasebook toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Daksh Sahni" },
    { name = "Umesh Patel", email = "169394288+UmeshCode1@users.noreply.github.com" }
]
keywords = ["japanese", "greetings", "cli", "culture", "language-learning", "phrasebook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.scripts]
konichiwa = "konichiwa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
